{% set name = "mbslave" %}
{% set version = "31.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  #url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mbslave-{{ version }}.tar.gz
  sha256: ff3e98134ced7d7f024f0101abe0ffaecd1c6fc2a2bc5960eb55bdfeba13e431
  url: https://github.com/acoustid/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz

build:
  entry_points:
    - mbslave = mbslave.replication:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - python >={{ python_min }},<4.0.0
    - psycopg2 >=2.9.2,<3.0.0
    - six >=1.16.0,<2.0.0
   # - prometheus_client >=0.20.0,<0.21.0
  run_constrained:
    - mbdata >=29

test:
  imports:
    - mbslave
  commands:
    - pip check
    - mbslave --help
  requires:
    - pip
    - python {{ python_min }}
about:
  summary: MusicBrainz Database Mirror
  license: MIT
  license_file: LICENSE
  home: https://github.com/acoustid/mbslave
  dev_url: https://github.com/acoustid/mbslave

extra:
  recipe-maintainers:
    - HeavyTony2
